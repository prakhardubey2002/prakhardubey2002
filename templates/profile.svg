<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1050" viewBox="0 0 900 1050" role="img" aria-labelledby="profile-title profile-description">
  <title id="profile-title">{{TITLE}}</title>
  <desc id="profile-description">{{DESCRIPTION}}</desc>

  <defs>
    <clipPath id="portrait-clip">
      <circle cx="145" cy="194" r="82"/>
    </clipPath>
    <filter id="portrait-monochrome" x="-10%" y="-10%" width="120%" height="120%">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.08" intercept="-0.04"/>
        <feFuncG type="linear" slope="1.08" intercept="-0.04"/>
        <feFuncB type="linear" slope="1.08" intercept="-0.04"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #090909; }
    .headline { font-size: 29px; font-weight: 400; letter-spacing: -0.9px; }
    .headline-accent { font-size: 29px; font-weight: 800; font-style: italic; letter-spacing: -0.9px; }
    .section { font-size: 16px; font-weight: 700; letter-spacing: 0.2px; }
    .name { font-size: 15px; font-weight: 700; }
    .role { font-size: 10px; font-weight: 700; }
    .body { font-size: 9.6px; }
    .body-small { font-size: 8.8px; }
    .muted { fill: #606060; }
    .faint { fill: #8a8a8a; }
    .label { font-size: 8.4px; font-weight: 700; }
    .value { font-size: 8.4px; font-weight: 700; text-anchor: end; }
    .entry { font-size: 11px; font-weight: 700; }
    .date { font-size: 8.3px; font-weight: 700; text-anchor: end; }
    .category { font-size: 8.5px; font-weight: 700; }
    .metric { font-size: 20px; font-weight: 700; }
    .metric-label { font-size: 7.5px; font-weight: 700; }
    .tag { font-size: 7.5px; font-weight: 700; letter-spacing: 0.25px; }
    .inverse { fill: #ffffff; }
    .rule-heavy { stroke: #090909; stroke-width: 2.4; }
    .rule { stroke: #090909; stroke-width: 1; }
    .rule-soft { stroke: #d3d3d3; stroke-width: 0.8; }
  </style>

