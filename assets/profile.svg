<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="profile-title profile-description">
  <title id="profile-title">Dynamic profile telemetry for Prakhar Dubey</title>
  <desc id="profile-description">Prakhar Dubey — SDE at @RecootyInc GitHub: 124 public repositories, 13 stars and 34 followers. npm: 7 packages, 8,670 downloads in the last year.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/>
      <stop offset="0.52" stop-color="#07111f"/>
      <stop offset="1" stop-color="#09051a"/>
    </linearGradient>
    <radialGradient id="cyan-haze" cx="0.12" cy="0.06" r="0.8">
      <stop offset="0" stop-color="#0ee9ff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#0ee9ff" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#0ee9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-haze" cx="0.92" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#9b5cff" stop-opacity="0.17"/>
      <stop offset="0.55" stop-color="#9b5cff" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#9b5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39f6ff"/>
      <stop offset="0.5" stop-color="#6d8cff"/>
      <stop offset="1" stop-color="#bd65ff"/>
    </linearGradient>
    <linearGradient id="accent-soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39f6ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#bd65ff" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="card-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1b2e" stop-opacity="0.93"/>
      <stop offset="1" stop-color="#07101e" stop-opacity="0.93"/>
    </linearGradient>
    <linearGradient id="scan-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39f6ff" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#39f6ff" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#39f6ff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="edge-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39f6ff" stop-opacity="0.8"/>
      <stop offset="0.16" stop-color="#39f6ff" stop-opacity="0"/>
      <stop offset="0.84" stop-color="#bd65ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#bd65ff" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#43d9ff" stroke-opacity="0.09" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="#65f7ff" fill-opacity="0.22"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="panel-clip">
      <rect x="20" y="20" width="1160" height="640" rx="24"/>
    </clipPath>
  </defs>

  <style>
    text { font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; }
    .code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; letter-spacing: 1.6px; }
    .pkg-name { fill: #dcecf5; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 11.5px; }
    .pkg-version { fill: #7f9bad; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 10px; }
    .grid { animation: grid-drift 18s linear infinite; }
    .scan-beam { animation: scan 7s cubic-bezier(.45,0,.55,1) infinite; }
    .orbit-a { transform-origin: 104px 130px; animation: orbit 13s linear infinite; }
    .orbit-b { transform-origin: 104px 130px; animation: orbit-reverse 9s linear infinite; }
    .core-pulse { transform-origin: 104px 130px; animation: core-pulse 2.8s ease-in-out infinite; }
    .status-pulse { transform-origin: 954px 48px; animation: status-pulse 1.8s ease-in-out infinite; }
    .signal-dash { animation: signal-dash 2.8s linear infinite; }
    .signal-dash.slow { animation-duration: 5.4s; animation-direction: reverse; }
    .packet { animation: packet 3.4s ease-in-out infinite; }
    .packet.delay-one { animation-delay: -0.85s; }
    .packet.delay-two { animation-delay: -1.7s; }
    .packet.delay-three { animation-delay: -2.55s; }
    .value-in { animation: value-in 0.75s ease-out both; }
    .value-in.delay { animation-delay: 0.12s; }
    .value-in.delay-two { animation-delay: 0.24s; }
    .value-in.delay-three { animation-delay: 0.36s; }
    @keyframes grid-drift { to { transform: translate(32px, 32px); } }
    @keyframes scan { 0% { transform: translateY(-90px); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateY(680px); opacity: 0; } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes orbit-reverse { to { transform: rotate(-360deg); } }
    @keyframes core-pulse { 0%, 100% { opacity: .45; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes status-pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes signal-dash { to { stroke-dashoffset: -72; } }
    @keyframes packet { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes value-in { from { opacity: .45; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .grid, .scan-beam, .orbit-a, .orbit-b, .core-pulse, .status-pulse,
      .signal-dash, .packet, .value-in { animation: none !important; }
    }
  </style>

